services:
    postgres:
        image: postgres:16-alpine
        pull_policy: missing
        container_name: payflow-db
        environment:
            POSTGRES_USER: payflow
            POSTGRES_PASSWORD: payflow_dev_password
            POSTGRES_DB: payflow
        ports:
            - "5432:5432"
        volumes:
            - payflow_pgdata:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U payflow"]
            interval: 5s
            timeout: 5s
            retries: 5
volumes:
    payflow_pgdata: